name: smartsprout
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # These must be aligned with 'flutter' above (2 spaces)
  http: ^1.1.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  fl_chart: ^1.1.1
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.3
  flutter_onscreen_keyboard: ^0.4.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/plants/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21